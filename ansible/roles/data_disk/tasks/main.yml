---
# O volume EBS aparece como NVMe; o link por ID é estável entre reinícios.
- name: Descobrir o dispositivo do disco de dados
  ansible.builtin.set_fact:
    data_device: "/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_{{ data_volume_id | replace('-', '') }}"

- name: Aguardar o disco ser anexado
  ansible.builtin.wait_for:
    path: "{{ data_device }}"
    timeout: 180

- name: Criar sistema de arquivos (só se o disco estiver vazio; nunca formata de novo)
  community.general.filesystem:
    fstype: ext4
    dev: "{{ data_device }}"

- name: Montar em {{ data_dir }} (persistente no fstab)
  ansible.posix.mount:
    path: "{{ data_dir }}"
    src: "{{ data_device }}"
    fstype: ext4
    opts: defaults,nofail
    state: mounted

# Disco ampliado pelo Terraform: estende o ext4 online (resize2fs), sem desmontar nem apagar dados.
- name: Expandir o sistema de arquivos até o tamanho atual do disco
  community.general.filesystem:
    fstype: ext4
    dev: "{{ data_device }}"
    resizefs: true

- name: Espaço do disco de dados
  ansible.builtin.command: df -h {{ data_dir }}
  register: data_df
  changed_when: false

- name: Mostrar espaço do disco de dados
  ansible.builtin.debug:
    msg: "{{ data_df.stdout_lines }}"
